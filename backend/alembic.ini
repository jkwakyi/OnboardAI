# Alembic configuration for the Main Database (ON-11).
#
# The database URL is NOT set here. It comes from the application settings,
# which read DATABASE_URL from the environment or a local .env, so the
# migration always runs against the same database the backend uses and no
# credentials end up in a committed file. See migrations/env.py.

[alembic]
script_location = migrations
prepend_sys_path = .
# Split prepend_sys_path the way this operating system does, rather than on
# the legacy space/comma/colon rule, which breaks on Windows drive letters.
path_separator = os
# A timestamp keeps revision files in chronological order on disk, which
# matters once three people are adding them.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
