[project]
name = "onboardai-backend"
version = "0.1.0"
description = "OnboardAI backend API (FastAPI modular monolith)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.32,<0.40",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "chromadb>=1.5,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.28,<0.29",
    "ruff>=0.8,<0.16",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need the dev stack; opt in with: pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: needs PostgreSQL and ChromaDB running (docker compose up -d)",
]
