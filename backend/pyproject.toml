[project]
name = "onboardai-backend"
version = "0.1.0"
description = "OnboardAI backend API (FastAPI modular monolith)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.32,<0.40",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    # Applies the Main Database schema as versioned migrations (ON-11).
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "chromadb>=1.5,<2",
    # Signs and verifies the login tokens (ON-36). Pure Python, so it needs
    # no compiler on Windows or in CI; password hashing uses the standard
    # library and adds no dependency at all.
    "pyjwt>=2.9,<3",
    # Parses multipart/form-data, which is how a document is uploaded
    # (ON-39). FastAPI needs it present to accept an UploadFile at all.
    "python-multipart>=0.0.18,<0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.28,<0.29",
    "ruff>=0.8,<0.16",
    # Generates the handbook PDFs from their TXT sources (ON-12).
    "reportlab>=4.2,<5",
    # Reads the generated PDFs back in the handbook tests.
    "pypdf>=5.1,<7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need the dev stack; opt in with: pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: needs PostgreSQL and ChromaDB running (docker compose up -d)",
    "handbook: checks the synthetic handbook corpus in data/handbook",
]
